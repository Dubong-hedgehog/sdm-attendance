<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDM 운영진 관리보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(160deg, #eef5f1 0%, #faf9f6 55%, #f5f1ea 100%); min-height: 100vh; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
  .card { background: #fff; border-radius: 22px; padding: 24px; margin-bottom: 16px; box-shadow: 0 16px 40px rgba(15,80,60,0.10); border: 1px solid rgba(0,0,0,0.03); }
  .admin-hero { background: linear-gradient(135deg, #1D9E75 0%, #0a7a56 100%); padding: 18px 22px; position: relative; overflow: hidden; box-shadow: 0 16px 34px rgba(15,110,86,0.22); }
  .admin-hero::after { content:''; position:absolute; width:150px; height:150px; border-radius:50%; right:-55px; top:-65px; background:rgba(255,255,255,0.10); }
  .admin-hero h1 { color: #fff; }
  .logout-btn { font-size:11px; font-weight:700; color:#fff; background:rgba(255,255,255,0.18); border:none; padding:6px 12px; border-radius:999px; cursor:pointer; position:relative; z-index:1; }
  h1 { font-size: 20px; font-weight: 600; color: #1D9E75; text-align: center; margin-bottom: 4px; }
  h2 { font-size: 16px; font-weight: 500; color: #333; margin-bottom: 16px; }
  h3 { font-size: 14px; font-weight: 500; color: #555; margin-bottom: 10px; }
  label { font-size: 13px; color: #666; display: block; margin-bottom: 6px; margin-top: 14px; }
  input[type=text], input[type=number], select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; background: #fbfcfb; }
  input:focus, select:focus, textarea:focus { border-color: #1D9E75; background:#f9fffe; }
  textarea { resize: vertical; min-height: 60px; }
  .btn { width: 100%; padding: 12px; background: #1D9E75; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; margin-top: 14px; cursor: pointer; box-shadow: 0 10px 22px rgba(15,110,86,0.22); }
  .btn:disabled { background: #ccc; cursor: not-allowed; box-shadow:none; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 9px; border: none; cursor: pointer; font-weight: 500; width: auto; margin-top: 0; }
  .btn-green { background: #1D9E75; color: #fff; }
  .btn-red { background: #E24B4A; color: #fff; }
  .btn-blue { background: #378ADD; color: #fff; }
  .btn-gray { background: #888; color: #fff; }
  .btn-outline { background: #fff; color: #1D9E75; border: 1px solid #1D9E75; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 10px; margin-bottom: 6px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; display: flex; flex-direction: row; align-items: center; gap: 5px; padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid #eee; color: #888; cursor: pointer; white-space: nowrap; }
  .tab-icon { font-size: 14px; line-height: 1; }
  .tab-label { font-size: 12px; font-weight: 600; }
  .tab.active { color: #fff; font-weight: 700; background: #1D9E75; border-color: #1D9E75; }
  .section { display: none; }
  .section.active { display: block; }
  .msg { text-align: center; padding: 10px; border-radius: 10px; font-size: 13px; margin-top: 10px; display: none; }
  .msg.success { background: #E1F5EE; color: #0F6E56; display: block; }
  .msg.error { background: #FCEBEB; color: #A32D2D; display: block; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: #F3FAF7; border: 1px solid #e2f0e9; border-radius: 14px; padding: 12px; text-align: center; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 600; color: #1D9E75; }
  .list-item { border: 1px solid #eee; border-radius: 14px; padding: 12px; margin-bottom: 8px; box-shadow: 0 6px 16px rgba(20,60,45,0.05); }
  .list-item-title { font-size: 14px; font-weight: 500; color: #333; margin-bottom: 6px; }
  .list-item-sub { font-size: 12px; color: #888; margin-bottom: 8px; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 4px; }
  .badge-green { background: #E1F5EE; color: #0F6E56; }
  .badge-red { background: #FCEBEB; color: #A32D2D; }
  .badge-gray { background: #f0f0f0; color: #666; }
  .badge-blue { background: #E6F1FB; color: #185FA5; }
  .toggle-wrap { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .toggle-wrap label { margin: 0; font-size: 13px; color: #555; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #1D9E75; }
  .select-wrap { position: relative; }
  .select-wrap::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #888; pointer-events: none; }
  .divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8f8f8; padding: 8px; text-align: left; color: #666; font-weight: 500; border-bottom: 1px solid #eee; }
  td { padding: 8px; border-bottom: 1px solid #f0f0f0; color: #333; }
  .empty { text-align: center; padding: 30px; color: #aaa; font-size: 14px; }
  .login-wrap { max-width: 360px; margin: 60px auto; }
</style>
</head>
<body>

      <h1>접근 불가</h1>

      <button class="btn" onclick="location.href='index.html'">대원페이지로 이동</button>

  </div>
</div>
<div class="container" id="admin-section" style="display:none;">
<div class="card admin-hero">
    <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;">

    <div id="admin-gen-switch-wrap" style="display:none; margin-top:10px; position:relative; z-index:1;">

      </select>
    </div>
  </div>
  <div class="card">
<div class="tabs">
      <div class="tab active" onclick="switchTab('dashboard')"><span class="tab-icon">📊</span><span class="tab-label">대시보드</span></div>
      <div class="tab" onclick="switchTab('member')"><span class="tab-icon">👥</span><span class="tab-label">대원관리</span></div>
      <div class="tab" onclick="switchTab('activity')"><span class="tab-icon">📅</span><span class="tab-label">활동관리</span></div>
      <div class="tab" onclick="switchTab('payment')"><span class="tab-icon">💳</span><span class="tab-label">납부관리</span></div>
      <div class="tab" onclick="switchTab('board')"><span class="tab-icon">💬</span><span class="tab-label">소셜링 신청</span></div>

      <h2>사전신청 납부 현황</h2>

        <select id="payment-activity" onchange="loadPayment()"></select>
      </div>

   <!-- 재고관리 -->

<script src="/config.js"></script>
<script>
let allActivities = [];
let allMembers = [];
let currentGen = '';
let adminName = '';
let memberAttendanceStats = {};
let allAttendance = [];
 
async function api(body) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showMsg(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg; el.className = 'msg ' + type;
  setTimeout(() => { el.className = 'msg'; }, 3000);
}
function getQueryParam(key) {
  return new URLSearchParams(location.search).get(key);
}
function showDenied(msg) {
  document.getElementById('denied-msg').textContent = msg;
  document.getElementById('denied-section').style.display = 'block';
  document.getElementById('admin-section').style.display = 'none';
}
async function initAdmin() {
  const saved = localStorage.getItem('sdm_session');
  if (!saved) {
    showDenied('대원페이지에서 먼저 로그인 후 접속해주세요.');
    return;
  }
  let session;
  try { session = JSON.parse(saved); } catch(e) { session = null; }
  if (!session || !session.name || !session.phone4) {
    showDenied('대원페이지에서 먼저 로그인 후 접속해주세요.');
    return;
  }
  const adminGens = (session.generations || []).filter(g => g.isAdmin).map(g => String(g.generation));
  if (adminGens.length === 0) {
    showDenied('운영진 권한이 없습니다.');
    return;
  }
  const sortedGens = adminGens.slice().sort((a, b) => Number(b) - Number(a));
  const urlGen = getQueryParam('gen');
  const gen = (urlGen && adminGens.includes(urlGen)) ? urlGen : sortedGens[0];
  const res = await api({ action: 'verifyAdminAccess', name: session.name, phone4: session.phone4, generation: gen });
  if (!res.success) {
    showDenied(res.message || '운영진 권한이 없습니다.');
    return;
  }
  currentGen = gen;
  adminName = session.name;
  renderAdminGenSelect(sortedGens);
  document.getElementById('admin-header-title').textContent = currentGen + '기 SDM 운영진 (' + adminName + ')';
  document.getElementById('denied-section').style.display = 'none';
  document.getElementById('admin-section').style.display = 'block';
  await loadAll();
}
function renderAdminGenSelect(gens) {
  const wrap = document.getElementById('admin-gen-switch-wrap');
  if (gens.length <= 1) { wrap.style.display = 'none'; return; }
  const select = document.getElementById('admin-gen-switch-select');
  select.innerHTML = gens.map(g => `<option value="${g}" ${g === currentGen ? 'selected' : ''}>${g}기</option>`).join('');
  wrap.style.display = 'block';
}
function onAdminGenSwitch() {
  const gen = document.getElementById('admin-gen-switch-select').value;
  if (gen === currentGen) return;
  location.href = 'admin.html?gen=' + encodeURIComponent(gen);
}
function doLogout() {
  localStorage.removeItem('sdm_session');
  location.href = 'index.html';
}

let allNotices = [];
async function loadAll() {
  await loadAttendanceOnce();
  await loadActivities();
  await loadMembers();
  loadDashboard();
  loadAdminBoardList();
  loadInventory();
  loadNoticesAdmin();
}

async function loadAttendanceOnce() {
  const res = await api({ action: 'getAttendance' });
  allAttendance = res.success ? res.attendance : [];
}
 
async function loadNoticesAdmin() {
  const res = await api({ action: 'getNotices', generation: currentGen });
  allNotices = res.success ? res.notices : [];
  renderNoticesAdmin();
}
 
function renderNoticesAdmin() {
  const list = document.getElementById('notice-admin-list');
  if (allNotices.length === 0) { list.innerHTML = '<div class="empty">등록된 공지가 없어요</div>'; return; }
  list.innerHTML = allNotices.map((n, i) => `
    <div class="list-item">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="list-item-title" onclick="toggleNoticeEdit(${i})" style="cursor:pointer; color:#1D9E75; text-decoration:underline;">${esc(n.title)} ${n.pinned ? '<span class="badge badge-green">고정</span>' : ''}</div>
      </div>
      <div class="list-item-sub">${esc(n.author || '-')} · ${String(n.createdAt).substring(0,16)}</div>
      <div class="btn-row">
        <button class="btn-sm ${n.pinned ? 'btn-gray' : 'btn-green'}" onclick="toggleNoticePinned(${i})">${n.pinned ? '고정 해제' : '상단 고정'}</button>
        <button class="btn-sm btn-red" onclick="deleteNoticeAdmin('${n.id}')">삭제</button>
      </div>
      <div id="notice-edit-${i}" style="display:none; margin-top:12px; border-top:1px solid #eee; padding-top:12px;">
        <label style="margin-top:0;">제목</label>
        <input type="text" id="notice-edit-title-${i}" value="${esc(n.title)}">
        <label>내용</label>
        <textarea id="notice-edit-content-${i}">${esc(n.content)}</textarea>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn-sm btn-green" style="flex:1; padding:10px;" onclick="saveNoticeEdit(${i})">저장</button>

async function buildNextActivityReadinessCard() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const upcoming = allActivities
    .filter(act => String(act['활성화']).toUpperCase() === 'TRUE')
    .filter(act => new Date(String(act['날짜']).split('T')[0]) >= today)
    .sort((a, b) => new Date(String(a['날짜']).split('T')[0]) - new Date(String(b['날짜']).split('T')[0]));
  if (upcoming.length === 0) return '';
  const act = upcoming[0];
  const activityId = act['활동ID'];

  const [preRes, checklistRes] = await Promise.all([
    api({ action: 'getPreRegister', activityId }),
    api({ action: 'getChecklist', activityId })
  ]);
  const preList = preRes.success ? preRes.preRegister : [];
  const preCount = preList.length;
  const unpaidCount = preList.filter(r => String(r['활동비납입']).toUpperCase() !== 'TRUE').length;
  const items = checklistRes.success ? checklistRes.items : [];
  const checkedCount = items.filter(it => it.checked).length;

  return `
    <div class="list-item" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:14px; font-weight:600; color:#333;">다음 활동 준비 현황</div>
        <span style="font-size:11px; color:#aaa;">${esc(act['활동명'])} · ${String(act['날짜']).split('T')[0]}</span>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
        <div style="background:#F3FAF7; border:1px solid #e2f0e9; border-radius:14px; padding:10px 6px; text-align:center;">
          <div style="font-size:10px; color:#888; margin-bottom:4px;">사전신청</div>
          <div style="font-size:18px; font-weight:600; color:#1D9E75;">${preCount}명</div>
        </div>
        <div style="background:${unpaidCount > 0 ? '#FCEBEB' : '#F3FAF7'}; border:1px solid ${unpaidCount > 0 ? '#f6d8d8' : '#e2f0e9'}; border-radius:14px; padding:10px 6px; text-align:center;">
          <div style="font-size:10px; color:${unpaidCount > 0 ? '#a32d2d' : '#888'}; margin-bottom:4px;">미납</div>
          <div style="font-size:18px; font-weight:600; color:${unpaidCount > 0 ? '#A32D2D' : '#1D9E75'};">${unpaidCount}명</div>
        </div>
        <div style="background:#F3FAF7; border:1px solid #e2f0e9; border-radius:14px; padding:10px 6px; text-align:center;">
          <div style="font-size:10px; color:#888; margin-bottom:4px;">준비물</div>
          <div style="font-size:18px; font-weight:600; color:#1D9E75;">${checkedCount}/${items.length}</div>
        </div>
      </div>
    </div>`;
}

async function download1365(activityId, actName) {
  const res = await api({ action: 'get1365List', activityId, generation: currentGen });
  if (!res.success || res.list.length === 0) { alert('1365 신청 대상자가 없어요.'); return; }
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  document.head.appendChild(script);
  script.onload = () => {
    const headers = ['이름', '전화번호', '생년월일', '인식코드', '1365 ID', '카톡입장', '활동비납입', '환불여부'];
    const rows = res.list.map(r => [
      r.name, r.phone, r.birth,
      r.code == 1 ? '운영진' : '일반대원',
      r.id1365, r.kakao, r.paid, r.refund
    ]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws['!cols'] = [
      { wch: 10 }, { wch: 16 }, { wch: 12 }, { wch: 10 },
      { wch: 16 }, { wch: 8 }, { wch: 10 }, { wch: 8 }
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '1365신청대상자');
    XLSX.writeFile(wb, `1365_${actName}.xlsx`);
  };
}

function toggleEditMember(idx) {
  const el = document.getElementById(`edit-member-${idx}`);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function saveEditMember(idx) {
  const m = allMembers[idx];
  let curName = m['이름'];
  let curPhone4 = String(m['전화번호']).replace(/-/g, '').replace(/\*/g, '').slice(-4);
  const newName = document.getElementById(`edit-member-name-${idx}`).value.trim();
  const newPhoneRaw = document.getElementById(`edit-member-phone-${idx}`).value.trim();
  const newBirth = document.getElementById(`edit-member-birth-${idx}`).value.trim();
  const newCode = document.getElementById(`edit-member-code-${idx}`).value.trim();
  const new1365 = document.getElementById(`edit-member-1365-${idx}`).value.trim();
  if (!newName) { showMsg(`edit-member-msg-${idx}`, '이름은 필수예요.', 'error'); return; }
  const changes = [];
  if (newName !== m['이름']) changes.push({ field: '이름', value: newName });
  if (newPhoneRaw) changes.push({ field: '전화번호', value: newPhoneRaw });
  if (newBirth !== (m['생년월일'] || '')) changes.push({ field: '생년월일', value: newBirth });
  if (newCode !== String(m['인식코드'] || '')) changes.push({ field: '인식코드', value: newCode });
  if (new1365 !== (m['1365 ID'] || '')) changes.push({ field: '1365 ID', value: new1365 });
  if (changes.length === 0) { toggleEditMember(idx); return; }
  for (const change of changes) {
    const res = await api({ action: 'updateMember', name: curName, phone4: curPhone4, field: change.field, value: change.value, generation: currentGen });
    if (!res.success) {
      showMsg(`edit-member-msg-${idx}`, res.message, 'error');
      return;
    }
    if (change.field === '이름') curName = change.value;
    if (change.field === '전화번호') curPhone4 = String(change.value).replace(/-/g, '').slice(-4);
  }
  await loadMembers();
}
async function toggleMember(idx, field) {
  const m = allMembers[idx];
  const current = String(m[field]).toUpperCase() === 'TRUE';
  const newVal = !current ? 'TRUE' : 'FALSE';
  const phone4 = String(m['전화번호']).replace(/-/g, '').replace(/\*/g, '').slice(-4);
  const res = await api({ action: 'updateMember', name: m['이름'], phone4, field, value: newVal, generation: currentGen });
  if (res.success) { allMembers[idx][field] = newVal; renderMemberList(); }
  else alert(res.message);
}

async function toggleActivity(idx) {
  const act = allActivities[idx];
  const current = String(act['활성화']).toUpperCase() === 'TRUE';
  const res = await api({ action: 'updateActivity', activityId: act['활동ID'], active: !current });
  if (res.success) { allActivities[idx]['활성화'] = !current ? 'TRUE' : 'FALSE'; renderActivityList(); }
  else alert(res.message);
}
 
async function addActivity() {
  const name = document.getElementById('new-act-name').value.trim();
  const date = document.getElementById('new-act-date').value.trim();
  const capacity = document.getElementById('new-act-capacity').value.trim();
  const deadline = document.getElementById('new-act-deadline').value;
  const sub = document.getElementById('new-act-sub').value.trim();
  const placeName = document.getElementById('new-act-place').value.trim();
  const address = document.getElementById('new-act-address').value.trim();
  const hasExtra = document.getElementById('new-act-extra').checked;
  const extraMsg = document.getElementById('new-act-extra-msg').value.trim();
  const extraItems = document.getElementById('new-act-extra-items').value.trim();
  const is1365 = document.getElementById('new-act-1365').checked;
  const active = document.getElementById('new-act-active').checked;
  const countAttendance = document.getElementById('new-act-count').checked;
  if (!name || !date) { showMsg('activity-msg', '활동명과 날짜는 필수예요.', 'error'); return; }
  const res = await api({
    action: 'addActivity', name, date,
    generation: currentGen, subItems: sub,
    capacity, deadline,
    placeName, address,
    extraFlag: hasExtra ? 'TRUE' : 'FALSE',
    extraMsg: extraMsg, extraItems: extraItems,
    is1365: is1365 ? 'TRUE' : 'FALSE', active, countAttendance
  });
  if (res.success) {
    showMsg('activity-msg', '활동이 추가되었습니다.', 'success');
    document.getElementById('new-act-capacity').value = '';
    document.getElementById('new-act-deadline').value = '';
    document.getElementById('new-act-place').value = '';
    document.getElementById('new-act-address').value = '';
    await loadActivities();
  } else { showMsg('activity-msg', res.message, 'error'); }
}

async function loadPayment() {
  const activityId = document.getElementById('payment-activity').value;
  if (!activityId) return;
  const res = await api({ action: 'getPreRegister', activityId });
  const list = document.getElementById('payment-list');
  if (!res.success || res.preRegister.length === 0) {
    list.innerHTML = '<div class="empty">사전신청자가 없어요</div>'; return;
  }
  list.innerHTML = res.preRegister.map(r => {
    const paid = String(r['활동비납입']).toUpperCase() === 'TRUE';
    const phone4 = String(r['전화번호']).replace(/-/g,'').slice(-4);
    return `
    <div class="list-item">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="list-item-title">${esc(r['이름'])}</div>
        <span class="badge ${paid ? 'badge-green' : 'badge-red'}">${paid ? '납부완료' : '미납'}</span>
      </div>
      <div class="list-item-sub">신청: ${String(r['신청시간']).substring(0,16)} ${r['세부항목납부'] ? '· ' + esc(r['세부항목납부']) : ''}</div>
      <button class="btn-sm ${paid ? 'btn-gray' : 'btn-green'}" onclick="togglePayment('${activityId}','${r['이름']}','${phone4}',${paid})">
        ${paid ? '납부취소' : '납부확인'}
      </button>
    </div>`;
  }).join('');
}

async function togglePayment(activityId, name, phone4, currentPaid) {
  const res = await api({ action: 'updatePayment', activityId, name, phone4, paid: !currentPaid });
  if (res.success) loadPayment();
  else alert(res.message);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active',
      (i===0&&tab==='dashboard')||(i===1&&tab==='member')||
      (i===2&&tab==='activity')||(i===3&&tab==='payment')||
      (i===4&&tab==='board')||(i===5&&tab==='inventory')
    );
  });
  ['dashboard','member','activity','payment','board','inventory'].forEach(t => {
    document.getElementById('section-'+t).classList.toggle('active', t===tab);
  });
}
document.getElementById('new-act-extra').addEventListener('change', function() {
  document.getElementById('new-act-extra-wrap').style.display = this.checked ? 'block' : 'none';
});
 async function toggleChecklist(idx) {
  const wrap = document.getElementById(`checklist-${idx}`);
  const isHidden = wrap.style.display === 'none';
  if (isHidden) {
    wrap.style.display = 'block';
    await loadChecklist(idx);
  } else {
    wrap.style.display = 'none';
  }
}
async function loadChecklist(idx) {
  const act = allActivities[idx];
  const res = await api({ action: 'getChecklist', activityId: act['활동ID'] });
  if (!res.success) return;
  renderChecklist(idx, res.items);
}
function renderChecklist(idx, items) {
  const container = document.getElementById(`checklist-items-${idx}`);
  if (items.length === 0) {
    container.innerHTML = '<div style="font-size:13px; color:#aaa; padding:4px 0;">준비물이 없어요. 아래에서 추가해주세요!</div>';
    return;
  }
  container.innerHTML = items.map((item, j) => `
    <div id="checklist-row-${idx}-${j}" style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #f5f5f5;">
      <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheckItem(${idx},${j},this.checked)" style="width:18px; height:18px;">
      <span style="flex:1; font-size:14px; ${item.checked ? 'text-decoration:line-through; color:#aaa;' : 'color:#333;'}">${item.name}</span>
      <div style="display:flex; gap:4px;">
        <button class="btn-sm btn-gray" onclick="moveCheckItem(${idx},${j},-1)" ${j===0 ? 'disabled' : ''}>↑</button>
        <button class="btn-sm btn-gray" onclick="moveCheckItem(${idx},${j},1)" ${j===items.length-1 ? 'disabled' : ''}>↓</button>
        <button class="btn-sm btn-red" onclick="deleteCheckItem(${idx},${j})">삭제</button>
      </div>
    </div>`).join('');
}
async function addChecklistItem(idx) {
  const input = document.getElementById(`checklist-input-${idx}`);
  const name = input.value.trim();
  if (!name) return;
  const act = allActivities[idx];
  const res = await api({ action: 'getChecklist', activityId: act['활동ID'] });
  const items = res.success ? res.items : [];
  items.push({ name, checked: false });
  const saveRes = await api({ action: 'saveChecklist', activityId: act['활동ID'], items });
  if (saveRes.success) { input.value = ''; renderChecklist(idx, items); }
}
async function toggleCheckItem(idx, j, checked) {
  const act = allActivities[idx];
  const res = await api({ action: 'getChecklist', activityId: act['활동ID'] });
  if (!res.success) return;
  res.items[j].checked = checked;
  await api({ action: 'saveChecklist', activityId: act['활동ID'], items: res.items });
  renderChecklist(idx, res.items);
}
async function moveCheckItem(idx, j, dir) {
  const act = allActivities[idx];
  const res = await api({ action: 'getChecklist', activityId: act['활동ID'] });
  if (!res.success) return;
  const items = res.items;
  const newJ = j + dir;
  if (newJ < 0 || newJ >= items.length) return;
  [items[j], items[newJ]] = [items[newJ], items[j]];
  await api({ action: 'saveChecklist', activityId: act['활동ID'], items });
  renderChecklist(idx, items);
}
async function deleteCheckItem(idx, j) {
  if (!confirm('삭제할까요?')) return;
  const act = allActivities[idx];
  const res = await api({ action: 'getChecklist', activityId: act['활동ID'] });
  if (!res.success) return;
  res.items.splice(j, 1);
  await api({ action: 'saveChecklist', activityId: act['활동ID'], items: res.items });
  renderChecklist(idx, res.items);
}
 function toggleEditActivity(idx) {
  const wrap = document.getElementById(`edit-activity-${idx}`);
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}
function toggleEditExtra(idx) {
  const checked = document.getElementById(`edit-extra-${idx}`).checked;
  document.getElementById(`edit-extra-wrap-${idx}`).style.display = checked ? 'block' : 'none';
}

async function saveEditActivity(idx) {
  const act = allActivities[idx];
  const name = document.getElementById(`edit-name-${idx}`).value.trim();
  const date = document.getElementById(`edit-date-${idx}`).value.trim();
  const capacity = document.getElementById(`edit-capacity-${idx}`).value.trim();
  const deadline = document.getElementById(`edit-deadline-${idx}`).value;
  const sub = document.getElementById(`edit-sub-${idx}`).value.trim();
  const placeName = document.getElementById(`edit-place-${idx}`).value.trim();
  const address = document.getElementById(`edit-address-${idx}`).value.trim();
  const kakaoLink = document.getElementById(`edit-kakao-${idx}`).value.trim();
  const pushMsg = document.getElementById(`edit-pushmsg-${idx}`).value.trim();
  const hasExtra = document.getElementById(`edit-extra-${idx}`).checked;
  const extraMsg = document.getElementById(`edit-extra-msg-${idx}`).value.trim();
  const extraItems = document.getElementById(`edit-extra-items-${idx}`).value.trim();
  const is1365 = document.getElementById(`edit-1365-${idx}`).checked;
  const active = document.getElementById(`edit-active-${idx}`).checked;
  const countAttendance = document.getElementById(`edit-count-${idx}`).checked;
  if (!name || !date) { showMsg(`edit-act-msg-${idx}`, '활동명과 날짜는 필수예요.', 'error'); return; }
  const res = await api({
    action: 'updateActivity',
    activityId: act['활동ID'],
    name, date,
    capacity, deadline,
    subItems: sub,
    placeName, address,
    kakaoLink, pushMsg,
    extraFlag: hasExtra ? 'TRUE' : 'FALSE',
    extraMsg, extraItems,
    is1365: is1365 ? 'TRUE' : 'FALSE',
    active, countAttendance
  });
  if (res.success) {
    allActivities[idx] = {
      ...act, '활동명': name, '날짜': date, '세부참여항목': sub,
      '정원': capacity, '마감일시': deadline,
      '장소명': placeName, '주소': address,
      '카카오톡링크': kakaoLink, '알림문구': pushMsg,
      '추가비용여부': hasExtra ? 'TRUE' : 'FALSE',
      '추가비용안내': extraMsg, '세부항목추가금': extraItems,
      '1365처리여부': is1365 ? 'TRUE' : 'FALSE',
      '활성화': active ? 'TRUE' : 'FALSE',
      '개근집계여부': countAttendance ? 'TRUE' : 'FALSE'
    };
    renderActivityList();
  } else {
    showMsg(`edit-act-msg-${idx}`, res.message, 'error');
  }
}

 function togglePerfectList() {
  const el = document.getElementById('perfect-list');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
     // 개근 수 확인
 function getCountedPastActivityIds() {
  const countedActivities = allActivities.filter(act =>
    String(act['개근집계여부']).toUpperCase() !== 'FALSE'
  );
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const pastActivities = countedActivities.filter(act => {
    const actDate = new Date(String(act['날짜']).split('T')[0]);
    return actDate <= today;
  });
  return new Set(pastActivities.map(a => a['활동ID']));
}
      // 개근 수 표기
async function loadMemberAttendanceStats() {
  const attendance = allAttendance;
  const countedIds = getCountedPastActivityIds();
  const total = countedIds.size;
  const attendedMap = {};
  attendance.forEach(r => {
    if (countedIds.has(r['활동ID'])) {
      if (!attendedMap[r['이름']]) attendedMap[r['이름']] = new Set();
      attendedMap[r['이름']].add(r['활동ID']);
    }
  });
  memberAttendanceStats = {};
  allMembers.forEach(m => {
    const name = m['이름'];
    memberAttendanceStats[name] = {
      total,
      attended: attendedMap[name] ? attendedMap[name].size : 0
    };
  });
}
